name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir public
          cp -r index.html css js assets README.md .nojekyll public/
          # Pages lets browsers cache css/js for 10 minutes; a per-commit version
          # makes every deploy load fresh files alongside the new index.html.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/index.html
          grep -q "?v=dev" public/index.html && { echo "cache-bust tokens left in index.html"; exit 1; } || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
